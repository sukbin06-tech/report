name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Generate Android project
        run: |
          mkdir -p proj/app/src/main/assets proj/app/src/main/res/values proj/app/src/main/java/com/example/communityreport
          cp index.html proj/app/src/main/assets/index.html
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CommunityReport'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.communityreport'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.communityreport'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="공동 보고"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          ICON=$(ls ../icon.png ../icon.jpg ../icon.jpeg ../icon.webp 2>/dev/null | head -n 1 || true)
          if [ -n "$ICON" ]; then
            echo "Using app icon: $ICON"
            if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi
            IM=convert; command -v magick >/dev/null 2>&1 && IM=magick
            mkdir -p app/src/main/res/drawable-nodpi
            $IM "$ICON[0]" -auto-orient -resize 512x512^ -gravity center -extent 512x512 app/src/main/res/drawable-nodpi/app_icon.png
            sed -i 's|<application|<application android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon"|' app/src/main/AndroidManifest.xml
          fi

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#1D4ED8</item>
                  <item name="android:statusBarColor">#172554</item>
                  <item name="android:navigationBarColor">#172554</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/communityreport/MainActivity.java <<'EOF'
          package com.example.communityreport;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView webView;
              private WebViewAssetLoader assetLoader;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF172554);
                  webView.setOnApplyWindowInsetsListener((v, insets) -> {
                      v.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
                      return insets;
                  });
                  setContentView(webView);

                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: community-report-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
