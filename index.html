<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#172554">
<title>공동 보고</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172033;background:#f3f5f9}
*{box-sizing:border-box}
body{margin:0}
header{background:#172554;color:white;padding:18px 16px 16px}
header h1{font-size:21px;margin:0 0 5px}
header p{font-size:12px;margin:0;color:#dbeafe}
main{max-width:760px;margin:0 auto;padding:14px}
.panel{background:white;border:1px solid #e4e8f0;border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 3px 12px #1725540a}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 10px}
.muted{color:#64748b;font-size:12px;line-height:1.55}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 6px}
input,textarea{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff;color:#172033}
textarea{min-height:72px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.primary{background:#1d4ed8;color:white}
.secondary{background:#e8eefc;color:#1e3a8a}
.ghost{background:#f1f5f9;color:#334155}
.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.hidden{display:none!important}
.notice{padding:11px 12px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.5;margin:10px 0}
.error{background:#fff1f2;color:#9f1239}
.success{background:#ecfdf5;color:#065f46}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{border:1px solid #e2e8f0;border-radius:12px;padding:11px}
.stat .name{font-size:12px;color:#475569;font-weight:700;margin-bottom:7px}
.stat .numbers{display:flex;gap:12px;font-size:13px}
.xnum{color:#475569}.onum{color:#1d4ed8}
.stat small{display:block;color:#64748b;font-size:11px;margin-top:4px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topline button{padding:8px 10px;font-size:12px}
.member{border:1px solid #e2e8f0;border-radius:14px;padding:13px;margin:10px 0}
.member.mine{border:2px solid #93c5fd;background:#f8fbff}
.member-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.member-name{font-weight:800;font-size:15px}
.me-tag{font-size:10px;color:#1d4ed8;background:#dbeafe;border-radius:20px;padding:4px 7px}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field{border:1px solid #e8edf4;border-radius:10px;padding:8px}
.field-name{font-size:11px;color:#64748b;margin-bottom:7px;min-height:16px}
.pills{display:flex;gap:6px}
.pill{flex:1;padding:7px 0;font-size:12px;background:#eef2f7;color:#64748b}
.pill.active-x{background:#e2e8f0;color:#1e293b;outline:1px solid #94a3b8}
.pill.active-o{background:#dbeafe;color:#1d4ed8;outline:1px solid #60a5fa}
.pill.readonly{cursor:default}
.note-view{font-size:12px;line-height:1.5;color:#475569;background:#f8fafc;border-radius:9px;padding:9px;margin-top:9px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-label{font-size:11px;font-weight:700;color:#64748b;margin-top:12px}
.date-row{display:flex;align-items:center;gap:8px}
.date-row input{flex:1}
code{background:#f1f5f9;padding:3px 6px;border-radius:6px;word-break:break-all}
footer{text-align:center;color:#94a3b8;font-size:11px;padding:14px}
@media(min-width:600px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.field-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <h1>공동 보고</h1>
  <p>서버 없이 이 기기에서만 동작 · 최대 8명 · 자동 집계</p>
</header>
<main>
  <section class="panel">
    <div class="topline">
      <div><h2 style="margin-bottom:3px">전체 현황</h2><div class="muted" id="memberCount"></div></div>
      <button class="ghost" id="toggleRoster">인원 관리</button>
    </div>
    <div class="muted" style="margin:10px 0 8px">보고 날짜</div>
    <div class="date-row"><input id="reportDate" type="date"><button class="secondary" id="shareText">요약 복사</button></div>
    <div id="stats" class="stats" style="margin-top:13px"></div>
    <div class="notice">미입력 기록은 X로 집계됩니다.</div>
    <div id="copyMsg" class="notice success hidden"></div>
  </section>

  <section id="rosterView" class="panel hidden">
    <h2>인원 관리 <span class="muted" id="rosterCount"></span></h2>
    <div id="rosterList"></div>
    <label for="newName">새 인원 이름</label>
    <input id="newName" maxlength="20" placeholder="예: 홍길동">
    <div class="actions"><button class="primary" id="addMember">추가</button></div>
    <div id="rosterMsg" class="notice error hidden"></div>
  </section>

  <section class="panel">
    <h2>개인별 보고 내용</h2>
    <p class="muted">이 기기에서 모든 인원의 기록을 직접 입력합니다. 데이터는 이 폰에만 저장됩니다.</p>
    <div id="members"></div>
  </section>

  <section class="panel">
    <h2>백업 / 복원</h2>
    <p class="muted">앱을 지우거나 폰을 바꿀 때를 대비해 백업 텍스트를 복사해 메모 등에 보관하세요.</p>
    <div class="actions"><button class="secondary" id="exportData">백업 복사</button></div>
    <label for="importText">복원할 백업 텍스트</label>
    <textarea id="importText" placeholder="백업 텍스트를 붙여넣으세요"></textarea>
    <div class="actions"><button class="danger" id="importData">복원 (현재 데이터 덮어쓰기)</button></div>
    <div id="dataMsg" class="notice hidden"></div>
  </section>
  <footer>공동 보고 · 단독 실행 · 최대 8명</footer>
</main>

<script>
(() => {
  const KEY = "community_report_local_v1", MAX = 8;
  const fields = [
    ["evening_rollcall","저녁점호 열외"],
    ["morning_rollcall","아침점호 열외"],
    ["reading_lights","독서연등"],
    ["religion","종교"],
    ["special","특이사항"],
    ["dinner_absence","저녁식집열외"]
  ];
  const $ = id => document.getElementById(id);
  const show = (id, yes=true) => $(id).classList.toggle("hidden", !yes);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const flash = (id, text, kind) => { const el=$(id); el.textContent=text; el.className="notice"+(kind?" "+kind:""); show(id,true); clearTimeout(el._t); el._t=setTimeout(()=>show(id,false),2500); };

  let mem = {data:null};
  let state = load();
  function load() {
    try { const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&Array.isArray(s.members)&&s.reports) return s; } catch {}
    return {members:[], reports:{}};
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { alert("저장하지 못했습니다."); } }
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const date = () => $("reportDate").value || today();
  function rec(id) {
    const r = (state.reports[date()]||{})[id] || {};
    const out = {special_note:r.special_note||""};
    fields.forEach(([k])=>out[k]=r[k]==="O"?"O":"X");
    return out;
  }
  function setRec(id, changes) {
    const d=date(); state.reports[d]=state.reports[d]||{};
    state.reports[d][id]={...rec(id),...changes};
    save(); render();
  }

  function render() {
    const ms=state.members;
    $("memberCount").textContent=`등록 ${ms.length}/${MAX}명`;
    $("stats").innerHTML=fields.map(([k,label])=>{
      let o=0; ms.forEach(m=>{ if(rec(m.id)[k]==="O") o++; });
      return `<div class="stat"><div class="name">${esc(label)}</div><div class="numbers"><span class="xnum">X <b>${ms.length-o}명</b></span><span class="onum">O <b>${o}명</b></span></div><small>전체 ${ms.length}명</small></div>`;
    }).join("");
    $("members").innerHTML = ms.length ? ms.map(m=>{
      const r=rec(m.id);
      const status=fields.map(([k,label])=>`<div class="field"><div class="field-name">${esc(label)}</div><div class="pills">
        <button class="pill ${r[k]==="X"?"active-x":""}" data-a="set" data-id="${m.id}" data-f="${k}" data-v="X">X</button>
        <button class="pill ${r[k]==="O"?"active-o":""}" data-a="set" data-id="${m.id}" data-f="${k}" data-v="O">O</button></div></div>`).join("");
      return `<article class="member"><div class="member-head"><span class="member-name">${esc(m.name)}</span></div>
        <div class="field-grid">${status}</div>
        <div class="note-label">특이사항 내용</div>
        <textarea id="note-${m.id}" maxlength="500" placeholder="필요한 경우 특이사항을 입력하세요">${esc(r.special_note)}</textarea>
        <div class="actions"><button class="secondary" data-a="note" data-id="${m.id}">특이사항 저장</button></div></article>`;
    }).join("") : `<div class="notice">먼저 '인원 관리'에서 이름을 추가하세요.</div>`;
    renderRoster();
  }
  function renderRoster() {
    $("rosterCount").textContent=`(${state.members.length}/${MAX})`;
    $("rosterList").innerHTML=state.members.map(m=>`<div class="date-row" style="margin-bottom:8px">
      <input value="${esc(m.name)}" maxlength="20" data-a="rename" data-id="${m.id}">
      <button class="danger" data-a="del" data-id="${m.id}">삭제</button></div>`).join("");
  }

  $("reportDate").value=today();
  $("reportDate").addEventListener("change",render);
  $("toggleRoster").addEventListener("click",()=>show("rosterView",$("rosterView").classList.contains("hidden")));
  $("addMember").addEventListener("click",()=>{
    const n=$("newName").value.trim();
    if(!n) return flash("rosterMsg","이름을 입력하세요.","error");
    if(state.members.length>=MAX) return flash("rosterMsg","최대 8명까지만 등록할 수 있습니다.","error");
    if(state.members.some(m=>m.name===n)) return flash("rosterMsg","이미 있는 이름입니다.","error");
    state.members.push({id:uid(),name:n}); $("newName").value=""; save(); render();
  });
  $("rosterList").addEventListener("change",e=>{
    const el=e.target.closest("input[data-a=rename]"); if(!el) return;
    const n=el.value.trim(), m=state.members.find(x=>x.id===el.dataset.id);
    if(!n||!m){ render(); return; }
    m.name=n; save(); render();
  });
  $("rosterList").addEventListener("click",e=>{
    const b=e.target.closest("button[data-a=del]"); if(!b) return;
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="정말 삭제?"; setTimeout(()=>{b.dataset.armed="";b.textContent="삭제";},2500); return; }
    state.members=state.members.filter(m=>m.id!==b.dataset.id); save(); render();
  });
  $("members").addEventListener("click",e=>{
    const b=e.target.closest("button[data-a]"); if(!b) return;
    if(b.dataset.a==="set") setRec(b.dataset.id,{[b.dataset.f]:b.dataset.v});
    if(b.dataset.a==="note") setRec(b.dataset.id,{special_note:$("note-"+b.dataset.id).value.trim()});
  });
  async function copy(text){ try{ await navigator.clipboard.writeText(text); return true; } catch { return false; } }
  $("shareText").addEventListener("click",async()=>{
    const lines=[`[공동 보고] ${date()}`];
    fields.forEach(([k,l])=>{ const o=state.members.filter(m=>rec(m.id)[k]==="O"); lines.push(`${l}: O ${o.length}명 / X ${state.members.length-o.length}명`+(o.length?` (O: ${o.map(m=>m.name).join(", ")})`:"")); });
    state.members.forEach(m=>{ const n=rec(m.id).special_note; if(n) lines.push(`- ${m.name}: ${n}`); });
    const t=lines.join("\n");
    flash("copyMsg",(await copy(t))?"요약을 복사했습니다. 메신저에 붙여넣으세요.":"복사하지 못했습니다.","success");
  });
  $("exportData").addEventListener("click",async()=>{
    const ok=await copy(JSON.stringify(state));
    if(!ok) $("importText").value=JSON.stringify(state);
    flash("dataMsg",ok?"백업을 복사했습니다.":"복사 권한이 없어 아래 입력칸에 백업을 표시했습니다. 직접 복사하세요.");
  });
  $("importData").addEventListener("click",()=>{
    try {
      const s=JSON.parse($("importText").value.trim());
      if(!s||!Array.isArray(s.members)||typeof s.reports!=="object") throw 0;
      s.members=s.members.slice(0,MAX); state=s; save(); render(); $("importText").value="";
      flash("dataMsg","복원했습니다.","success");
    } catch { flash("dataMsg","백업 형식이 올바르지 않습니다.","error"); }
  });
  render();
})();
</script>
</body>
</html>
